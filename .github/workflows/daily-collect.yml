name: daily-collect
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
      RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/run.py --since-days 3 --collect-only
      - name: commit queue
        run: |
          git config user.name "breach-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.jsonl
          git diff --cached --quiet || git commit -m "collect: $(date -u +%F)"
          git push

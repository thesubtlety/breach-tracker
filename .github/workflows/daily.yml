name: daily
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: max LLM extractions this run
        default: "80"
      letters:
        description: max notification letters to read this run
        default: "30"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    name: collect, extract, build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write  # the run commits data/ back to the branch
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the pipeline parses untrusted pages and PDFs; the push step gets its own token
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest -q tests
      - run: python pipeline/run.py --since-days 3 --limit "$LIMIT"
        env:
          LIMIT: ${{ github.event.inputs.limit || '80' }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
      - run: python pipeline/letters.py --limit "$LETTERS"
        env:
          LETTERS: ${{ github.event.inputs.letters || '30' }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python pipeline/vendor_aliases.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python pipeline/verify_sources.py --strict
        continue-on-error: true
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
      - run: python pipeline/external.py
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      - run: python pipeline/build_site.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: commit data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "breach-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "daily: $(date -u +%F)"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch "$remote" "$GITHUB_REF_NAME"
            git rebase --autostash FETCH_HEAD  # onto anything pushed while this run was working
            git push "$remote" "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          exit 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    name: deploy to Pages
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write     # create the Pages deployment
      id-token: write  # OIDC token that deploy-pages uses to prove the artifact's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
